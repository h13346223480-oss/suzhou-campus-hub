{% extends 'base.html' %}{% block title %}分享调查{% endblock %}{% block content %}<section class="section container narrow"><a class="back" href="{{ url_for('survey_admin.index') }}">← 返回调查管理</a><div class="share-card"><span class="eyebrow">分享调查</span><h1>{{ survey.title }}</h1><img src="{{ url_for('survey_admin.qrcode_png', survey_id=survey.id) }}" alt="调查二维码"><label>公开调查链接</label><div class="copy-link"><input class="input" id="public-link" value="{{ public_url }}" readonly><button class="btn primary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('public-link').value);this.textContent='已复制'">复制链接</button></div><div class="actions"><a class="btn secondary" href="{{ url_for('survey_admin.qrcode_png', survey_id=survey.id) }}">下载 PNG 二维码</a><a class="btn secondary" href="{{ public_url }}" target="_blank">打开调查</a></div><p class="survey-disclaimer">学生自发调查，非学校官方。二维码不含学校校徽。</p></div></section>{% endblock %}
