{% extends 'base.html' %}
{% block title %}确认删除答卷{% endblock %}
{% block content %}<section class="form-page container narrow"><a class="back" href="{{ url_for('survey_admin.response_detail', survey_id=survey.id, response_id=response.id) }}">← 返回答卷</a><span class="eyebrow">二次确认</span><h1>删除答卷 #{{ response.id }}？</h1><div class="callout"><strong>此操作不可撤销</strong><p>答卷内容及其人工标签会被删除；系统仅保留删除动作、答卷编号、状态、题目编号等非敏感审计元数据。</p></div><form class="form-card" method="post" action="{{ url_for('survey_admin.delete_response', survey_id=survey.id, response_id=response.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="check-row"><input type="checkbox" name="confirm_delete" value="yes" required><span>我已核对答卷编号，并确认删除这份答卷</span></label><button class="btn danger" type="submit">确认永久删除</button></form></section>{% endblock %}
