{% extends 'base.html' %}{% block title %}新生指南{% endblock %}{% block content %}<section class="page-header guide-head"><div class="container"><span class="eyebrow">新生指南</span><h1>第一次来，也能找到方向</h1><p>内容由学生整理，仅供校园生活参考，请以学校官方通知为准。</p></div></section><section class="section container"><form class="filter-bar" method="get"><input class="input" name="q" value="{{ keyword }}" placeholder="搜索指南"><select class="input" name="category"><option value="">全部分类</option>{% for item in categories %}<option {% if item==selected %}selected{% endif %}>{{ item }}</option>{% endfor %}</select><button class="btn primary">查找</button><a class="btn secondary" href="{{ url_for('guides.faq') }}">常见问题</a></form><div class="guide-grid">{% for guide in guides %}<a class="guide-card" href="{{ url_for('guides.detail', slug=guide.slug) }}"><span class="tag warm-tag">{{ guide.category }}</span><h2>{{ guide.title }}</h2><p>{{ guide.summary }}</p><span class="read-more">阅读指南 →</span></a>{% else %}<div class="empty full">暂时没有相关指南。</div>{% endfor %}</div></section>{% endblock %}
