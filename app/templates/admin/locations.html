{% extends 'base.html' %}
{% block title %}地图地点管理{% endblock %}
{% block content %}
<section class="section container"><h1>地图地点管理</h1>{% include 'admin/_nav.html' %}<div class="admin-columns">
  <form class="form-card" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>添加地点</h2><div class="field"><label>名称</label><input class="input" name="name" required maxlength="80"></div><div class="field"><label>分类</label><select class="input" name="category">{% for item in categories %}<option>{{ item }}</option>{% endfor %}</select></div><div class="field"><label>说明</label><textarea class="input" name="description" required></textarea></div><div class="field"><label>地点图片（可选，最大 {{ config.MAX_CONTENT_LENGTH // 1024 // 1024 }}MB）</label><input class="input" type="file" name="image" accept=".jpg,.jpeg,.png,.webp"></div><button class="btn primary">添加地点</button></form>
  <div><h2>现有地点</h2>{% for item in locations %}<div class="list-card"><strong>{{ item.name }}</strong><span>{{ item.category }}</span><a class="btn small secondary" href="{{ url_for('admin.edit_location', location_id=item.id) }}">编辑</a><form method="post" action="{{ url_for('admin.delete_location', location_id=item.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn small danger">删除</button></form></div>{% else %}<div class="empty">暂无地图地点。</div>{% endfor %}</div>
</div></section>
{% endblock %}
