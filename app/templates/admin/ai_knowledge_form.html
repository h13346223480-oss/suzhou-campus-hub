{% extends 'base.html' %}{% block title %}{{ '编辑知识条目' if entry else '新增知识条目' }}{% endblock %}{% block content %}<section class="section container narrow"><h1>{{ '编辑知识条目' if entry else '新增知识条目' }}</h1>{% include 'admin/_nav.html' %}<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>标题 *</label><input class="input" name="title" maxlength="120" value="{{ entry.title if entry else '' }}" placeholder="如：新生报到需要带哪些材料？" required><label>内容 *</label><textarea class="input" name="content" maxlength="4000" rows="8" placeholder="填写这条信息的准确内容，AI 将优先依据它回答。" required>{{ entry.content if entry else '' }}</textarea><label>关键词（逗号分隔，用于匹配用户提问）</label><input class="input" name="keywords" maxlength="255" value="{{ entry.keywords if entry else '' }}" placeholder="如：报到, 材料, 录取通知书"><label><input type="checkbox" name="is_active" {% if not entry or entry.is_active %}checked{% endif %}> 启用（参与 AI 回答匹配）</label><div class="button-row"><button class="btn primary">保存</button><a class="btn secondary" href="{{ url_for('admin.ai_knowledge') }}">返回</a></div></form></section>{% endblock %}
