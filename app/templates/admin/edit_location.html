{% extends 'base.html' %}{% block title %}编辑地图地点{% endblock %}{% block content %}<section class="form-page container narrow"><a class="back" href="{{ url_for('admin.locations') }}">← 返回地图地点</a><h1>编辑地图地点</h1><form class="form-card" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>名称</label><input class="input" name="name" value="{{ item.name }}" required maxlength="80"></div><div class="field"><label>分类</label><select class="input" name="category">{% for category in categories %}<option {% if item.category==category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div><div class="field"><label>说明</label><textarea class="input" name="description" required>{{ item.description }}</textarea></div><div class="field"><label>替换图片（可选，最大 5MB）</label><input class="input" type="file" name="image" accept=".jpg,.jpeg,.png,.webp"></div><button class="btn primary">保存修改</button></form></section>{% endblock %}
