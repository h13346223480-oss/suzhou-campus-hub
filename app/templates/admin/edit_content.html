{% extends 'base.html' %}
{% block title %}编辑内容{% endblock %}
{% block content %}<section class="form-page container narrow"><a class="back" href="{{ url_for('admin.content') }}">← 返回内容管理</a><h1>编辑{% if kind == 'guide' %}攻略{% else %}英语资料{% endif %}</h1><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>标题</label><input class="input" name="title" value="{{ item.title }}" required maxlength="120"></div><div class="field"><label>分类</label><select class="input" name="category">{% for category in categories %}<option {% if item.category==category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div>{% if kind == 'guide' %}<div class="field"><label>摘要</label><input class="input" name="summary" value="{{ item.summary }}" maxlength="240"></div>{% else %}<div class="field"><label>适用专业</label><select class="input" name="major">{% for code,label in resource_major_choices %}<option value="{{ code }}" {% if item.major_code==code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="field"><label>难度</label><select class="input" name="difficulty">{% for level in ['入门','进阶','综合'] %}<option {% if item.difficulty==level %}selected{% endif %}>{{ level }}</option>{% endfor %}</select></div>{% endif %}<div class="field"><label>正文</label><textarea class="input" name="content" required>{{ item.content }}</textarea></div><button class="btn primary">保存修改</button></form></section>{% endblock %}
