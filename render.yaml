services:
  - type: web
    name: suzhou-campus-hub
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    dockerCommand: sh /srv/app/scripts/render-free-start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: suzhou-campus-hub-db
          property: connectionString
      - key: TRUST_PROXY
        value: "True"
      - key: FEATURE_SURVEYS_PUBLIC
        value: "True"
      - key: FEATURE_TUTORING_PUBLIC
        value: "False"
      - key: UPLOAD_FOLDER
        value: /srv/app/app/static/uploads
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_REQUESTS
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NICKNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: suzhou-campus-hub-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
